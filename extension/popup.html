<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root {
    --safe: #22c55e;
    --suspicious: #f59e0b;
    --phishing: #ef4444;
    --bg: #0f1420;
    --card: #171d2e;
    --border: #2a3348;
    --text: #e8ecf5;
    --muted: #8a94a6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 300px;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  .header .brand { display: flex; align-items: center; gap: 8px; }
  .header .logo {
    width: 22px; height: 22px;
    background: linear-gradient(135deg, #6366f1, #3b82f6);
    border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .header .name { font-weight: 600; font-size: 13px; }
  .header .menu { color: var(--muted); font-size: 15px; }

  .status-block { padding: 20px 16px; text-align: center; }
  .status-icon {
    width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  .status-icon.safe { background: rgba(34,197,94,0.12); color: var(--safe); }
  .status-icon.suspicious { background: rgba(245,158,11,0.12); color: var(--suspicious); }
  .status-icon.phishing { background: rgba(239,68,68,0.12); color: var(--phishing); }

  .status-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .status-title.safe { color: var(--safe); }
  .status-title.suspicious { color: var(--suspicious); }
  .status-title.phishing { color: var(--phishing); }

  .status-url { color: var(--muted); font-size: 11.5px; word-break: break-all; padding: 0 8px; }

  .reasons-wrap { padding: 0 16px 16px; }
  .reasons {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
  }
  .reasons .heading {
    font-size: 10.5px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .reasons ul { list-style: none; }
  .reasons li { font-size: 12px; padding: 3px 0; display: flex; align-items: flex-start; gap: 6px; }
  .reasons li::before { content: "•"; color: var(--suspicious); font-weight: 900; }
  .no-reasons { font-size: 12px; color: var(--muted); font-style: italic; }

  .action-wrap { padding: 0 16px 16px; }
  .action-btn {
    width: 100%; border: none; border-radius: 8px; padding: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer; color: white;
  }
  .action-btn.phishing { background: rgba(239,68,68,0.9); }
  .action-btn.suspicious { background: rgba(245,158,11,0.9); color: #412402; }

  .loading { text-align: center; padding: 30px 0; color: var(--muted); font-size: 13px; }
  .spinner {
    width: 26px; height: 26px; border: 3px solid #232b3d; border-top-color: #6366f1;
    border-radius: 50%; margin: 0 auto 10px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="logo">🛡️</div>
    <span class="name">PhishBlockAI</span>
  </div>
  <span class="menu">☰</span>
</div>

<div id="content">
  <div class="loading">
    <div class="spinner"></div>
    Scanning current page...
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
